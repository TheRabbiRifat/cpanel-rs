[package]
name = "cpanel-rs"
version = "0.3.0"
edition = "2021"
description = "An unofficial Rust client for the cPanel & WHM APIs."
readme = "README.md"
authors = ["Rabbi Rifat <i.rabbirifat@gmail.com>"]
license = "MIT"
repository = "https://github.com/TheRabbiRifat/cpanel-rs"
documentation = "https://docs.rs/cpanel-rs/latest/cpanel_rs/"
homepage = "https://github.com/TheRabbiRifat/cpanel-rs"
keywords = ["cpanel", "whm", "hosting", "api", "automation"]
categories = ["api-bindings", "web-programming"]
rust-version = "1.70"

[features]
default = []
dotenv = ["dep:dotenv"]
retry = []
stream = []
full = ["dotenv", "retry", "stream"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
url = "2.4"
urlencoding = "2.1"
base64 = "0.22"
futures = "0.3"
tracing = { version = "0.1", optional = true }
rand = "0.8"
http-body-util = "0.1"
tower-http = { version = "0.5", features = ["timeout"], optional = true }
dotenv = { version = "0.15", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "macros"] }
tracing-subscriber = "0.3"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"
